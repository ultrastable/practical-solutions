# budget: public repository, unmetered; about 1 minute a run.
# trigger: every 3 hours and after a finished tenant deploy (second route, at most every 2 hours); items are bounded and deduplicated by key, so a pass with nothing new files nothing, and the agent is dispatched at once instead of waiting for its own schedule (GitHub's scheduler skips runs).
# free-alternative: none needed; the run reads this repository and the live counters and files items with its own GITHUB_TOKEN.
# IMPACT-LOOP-1: record the impact and reach series, settle earlier predictions, file the next bounded items for the free code agent (agent.yml).
name: impact-loop
on:
  schedule: [{ cron: '41 */3 * * *' }]
  workflow_run: { workflows: [deploy-tenant], types: [completed] }   # second trigger: the scheduler skipped the 18:41 pass on 2026-11-25; tools/impactloop.mjs rate-limits this one to every 2 h
  workflow_dispatch: {}
concurrency: { group: impact-loop, cancel-in-progress: false }
permissions: { contents: write, issues: write, pull-requests: write, actions: write, models: read, id-token: write }
jobs:
  loop:
    if: ${{ vars.HALT != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: gh label create impact-loop --color 0e8a16 || true
      - name: find real sources for the solutions that are not yet ready (Europe PMC, DOI resolved at Crossref)
        run: node --no-warnings tools/implevidence.mjs
      - run: node --no-warnings tools/impactloop.mjs
      - name: grow the catalogue by one sourced solution for one problem (checked against real abstracts, tests, then merged)
        run: node --no-warnings tools/growsolution.mjs || echo "growth step failed; recorded, next pass retries"
        env: { GITHUB_TOKEN: '${{ github.token }}', PS_LLM_URL: 'https://tenant-ps-llm.ultrastable.workers.dev/ps/llm' }
      - name: start the code agent now (a schedule alone can skip hours)
        run: gh workflow run agent.yml || echo "agent dispatch failed; its own 2-hour schedule is the second route"
      - name: commit ledger
        run: |
          git config user.name practical-solutions-bot
          git config user.email bot@users.noreply.github.com
          git add ledger/impact.json ledger/impl-evidence.json ledger/grow.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "impact-loop: daily readings"
          for i in 1 2 3; do git pull --rebase -q -X theirs origin main && git push && break; sleep $((i*5)); done

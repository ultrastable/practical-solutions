# budget: public repository, unmetered; about 2 minutes a day.
# trigger: daily; the World Bank and UNDP series change yearly, so faster adds load and no information.
# free-alternative: none needed; runs on the run's own GITHUB_TOKEN with no secret.
# Refreshes data/context.json (country income groups, HDI tiers, infrastructure access, per-income-group problem series), commits it,
# and dispatches the deploy, whose live check is the gate. A source that fails keeps its previous values and is named in the snapshot.
name: context
on:
  schedule: [{ cron: '29 2 * * *' }]
  workflow_dispatch: {}
concurrency: { group: context, cancel-in-progress: false }
permissions: { contents: write, actions: write }
jobs:
  refresh:
    if: ${{ vars.HALT != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/checkout@v7
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --no-warnings tools/refresh_context.mjs | tee refresh.json
      - run: npm test
      - name: commit and deploy
        run: |
          git config user.name practical-solutions-bot
          git config user.email bot@users.noreply.github.com
          git add data/context.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "context: refresh country income, HDI, infrastructure and per-group series"
          for i in 1 2 3; do git pull --rebase -q -X theirs origin main && git push && break; sleep $((i*5)); done
          bash tools/dispatch_deploy.sh

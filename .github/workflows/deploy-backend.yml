# Deploys the tenant backend Worker (tenant-ps-core: tick, outreach, inbound mail handler) through the deploy gateway with a GitHub OIDC token.
# The gateway must hold an ALLOW rule for this repo, script tenant-ps-core and refs/heads/main; until it does the gateway answers 403 and this job fails visibly.
name: deploy-backend
on:
  push: { branches: [main], paths: ['worker/src/index.js', 'worker/src/solutions.js', 'worker/src/publish.js', 'worker/src/selfmigrate.gen.js', 'worker/self-migrate.json', 'ps/**', 'org/**', 'vendor/**', '.github/workflows/deploy-backend.yml'] }
  workflow_dispatch: {}
concurrency: { group: deploy-backend, cancel-in-progress: false }
permissions: { contents: write, id-token: write }  # HOSTSYNC-1: the record step commits ops/hosting
env:
  GATEWAY: https://ultrastable-deploy-gateway.ultrastable.workers.dev
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm test
      - run: npx --yes esbuild worker/src/index.js --bundle --format=esm --platform=neutral --external:node:* --define:import.meta.url='"file:///worker/"' --minify --outfile=.build-backend.js
      - name: deploy via gateway
        run: |
          tok=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$GATEWAY" | jq -r .value)
          curl -sS -X POST "$GATEWAY/deploy" -H "Authorization: Bearer $tok" -F script=tenant-ps-core -F worker.js=@.build-backend.js -o out.json -w '%{http_code}\n' | tee code.txt
          cat out.json; echo; [ "$(cat code.txt)" = 200 ]
      - name: run the backend once and read it live (BACKEND-PULSE-1)
        run: |
          # tenant-ps-core has no cron: POST /pulse/watch runs its tick and graph when due; GET /pulse is 503 until the graph has run and is fresh.
          for try in 1 2 3 4 5; do
            curl -sS -X POST https://tenant-ps-core.ultrastable.workers.dev/pulse/watch -o pulse.json -w '%{http_code}\n' > code.txt; cat pulse.json; echo
            curl -sS https://tenant-ps-core.ultrastable.workers.dev/pulse -o reading.json -w '%{http_code}\n' > code.txt; cat reading.json; echo
            [ "$(cat code.txt)" = 200 ] && break; sleep 10
          done
          [ "$(cat code.txt)" = 200 ]
      - name: record in the audit log
        if: success()
        run: node tools/audit_post.mjs --kind deploy --subject tenant-ps-core --summary "backend deployed through the gateway from main"
      - name: record the deployed module as expected (HOSTSYNC-1)
        if: success()
        run: |
          node vendor/ultrastable/tools/hostsync.mjs expect --script tenant-ps-core --sha256 "$(jq -r .sha256 out.json)"
          bash vendor/ultrastable/tools/hostsync_commit.sh "host-sync - record deployed tenant-ps-core"

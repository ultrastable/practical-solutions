name: ci
# LANE-FAST-1 (mirrors ultrastable checks.yml): merge in this run the moment every job passes, no second workflow or runner.
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: '17 5 * * *' }]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: core is the only source of generic code (TENANT-SYNC-1)
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 vendor/ultrastable/tools/tenant_sync.py check --tenant .
      - run: npm test
      - run: npm run test:vendor
      - run: node tools/build_migrations.mjs --check
      - name: the loop runs from birth on a fake clock and reports its own criticality
        run: node --no-warnings bin/ps.mjs simulate --days 150 | tee simulate.txt || true
      - uses: actions/upload-artifact@v4
        with: { name: simulate, path: simulate.txt }
  access:
    # The access preflight (core/access): probes the real state of every capability this tenant depends on, fails when a required one is
    # not present, and fails when any file asks a person for a capability the probe shows present or unproven missing.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, actions: read }
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --no-warnings vendor/ultrastable/core/access/cli.mjs --config ps/access.mjs --out access-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: access-report, path: access-report.json }
  reference-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy
      - name: the Python prototype stays a runnable behaviour reference
        working-directory: reference/python
        run: python -m unittest discover -s tests -t . -v
  lane:
    # LANE-FAST-1: merge this PR as soon as test, access and reference-python pass. Same-repository, non-draft PRs only; a PR the token cannot merge
    # (it changes .github/workflows/**) is left to the platform lane, which holds the workflow-capable credential.
    needs: [test, access, reference-python]
    if: ${{ vars.HALT != '1' && github.event_name == 'pull_request' && github.event.pull_request.draft != true && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: { contents: write, pull-requests: write }
    steps:
      - name: Squash-merge this PR now
        env:
          GH_TOKEN: ${{ secrets.LANE_PAT || secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$SHA" || echo "not merged here, the platform lane takes it"

# budget: public repository, unmetered; about 3 minutes a run.
# trigger: daily and on any change to the synthesis data or gate; sources change slowly, so faster adds load and no information.
# free-alternative: none needed; Crossref, Europe PMC and OpenAlex are free public APIs and the run uses its own GITHUB_TOKEN.
# SYNTHESES-1: verifies every cited paper and quoted figure behind each new-solution entry, searches for closest prior work, rebuilds the
# generated module (only verified entries appear), commits it and dispatches the deploy, whose live check is the gate.
name: synth
on:
  schedule: [{ cron: '41 3 * * *' }]
  push: { branches: [main], paths: ['worker/src/syntheses-data.js', 'tools/synth.mjs', '.github/workflows/synth.yml'] }
  workflow_dispatch: {}
concurrency: { group: synth, cancel-in-progress: false }
permissions: { contents: write, actions: write }
jobs:
  verify:
    if: ${{ vars.HALT != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/checkout@v7
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: verify sources and build
        run: node --no-warnings tools/synth.mjs | tee synth.json
      - run: npm test
      - name: commit and deploy
        run: |
          git config user.name practical-solutions-bot
          git config user.email bot@users.noreply.github.com
          node tools/askindex.mjs
          git add ledger/syntheses-verified.json worker/src/syntheses.gen.js worker/src/ask-index.gen.js
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "syntheses: verification record and generated module"
          for i in 1 2 3; do git pull --rebase -q -X theirs origin main && git push && break; sleep $((i*5)); done
          bash tools/dispatch_deploy.sh

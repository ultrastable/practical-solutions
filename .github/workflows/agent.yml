# budget: public repository, so Actions minutes are unmetered; each run is about 3 minutes.
# trigger: an issue labelled `idea` or `agent-task` (intake), every 2 hours and after each impact-loop pass (backlog; a run with no open agent-task issue exits in under a minute), a finished deploy (settle), manual dispatch.
# free-alternative: none needed; models run on GitHub Models with the run's own GITHUB_TOKEN, no key a person mints.
# The free code agent: works `agent-task` issues from trusted authors through tests, deploy and the live check; reverts what breaks.
name: agent
on:
  issues: { types: [opened, labeled] }
  schedule: [{ cron: '41 */2 * * *' }]
  workflow_run: { workflows: [deploy-tenant], types: [completed] }
  workflow_dispatch: { inputs: { issue: { description: 'issue number (default: lowest open agent-task)', required: false } } }
concurrency: { group: agent, cancel-in-progress: false }
permissions: { contents: write, issues: write, pull-requests: write, actions: write, models: read, id-token: write }
env:
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}
  # second free route: Workers AI behind the tenant's model Worker, reached with this run's OIDC token (GitHub Models may be off for the org)
  PS_LLM_URL: https://tenant-ps-llm.ultrastable.workers.dev/ps/llm
jobs:
  work:
    # issues: only an issue labelled idea or agent-task starts a run (a label added by the built-in token starts no workflow, so intake happens in the first step)
    if: ${{ vars.HALT != '1' && github.event_name != 'workflow_run' && (github.event_name != 'issues' || ((github.event.label.name == 'idea' || github.event.label.name == 'agent-task' || contains(join(github.event.issue.labels.*.name, ','), 'idea') || contains(join(github.event.issue.labels.*.name, ','), 'agent-task')))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: ensure labels
        run: |
          for l in agent-task agent-failed idea; do gh label create "$l" -R "$GITHUB_REPOSITORY" --color 5319e7 || true; done
      - name: intake, an idea from a trusted author becomes an agent task
        if: ${{ github.event_name == 'issues' }}
        run: |
          # trusted means write access (the API reports a private org member as CONTRIBUTOR, so the association alone is not enough)
          perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/${{ github.event.issue.user.login }}/permission" --jq .permission || echo none)
          case "$perm" in admin|maintain|write) gh issue edit ${{ github.event.issue.number }} --add-label agent-task -R "$GITHUB_REPOSITORY" ;; *) echo "author has $perm access: not an agent task" ;; esac
      - name: reconcile issues (label ideas, close what already passes)
        run: node --no-warnings tools/agent.mjs reconcile --no-fail
      - name: work one agent-task issue
        id: agent
        run: |
          # IMPACT-LOOP-1: a run works up to 3 open agent-task issues (agent.json keeps the last result; the deploy step below reads it), so a queue of items drains in hours, not days
          for n in 1 2 3; do node --no-warnings tools/agent.mjs run ${{ inputs.issue && format('--issue {0}', inputs.issue) || '' }} | tee agent.$n.json; cp agent.$n.json agent.json; grep -q '"picked":null' agent.$n.json && break; ${{ inputs.issue && 'break' || 'true' }}; git checkout -q main && git pull -q --ff-only origin main || true; done
      - name: record in the audit log
        if: success()
        run: node tools/audit_post.mjs --kind entry_change --subject agent --summary "code agent worked one agent-task issue" --payload-file agent.json
      - name: an issue still open past 24 h fails the run, so ciwatch files it (SLA-ISSUE-1)
        if: ${{ always() }}
        run: node --no-warnings tools/agent.mjs reconcile
      - name: chain, a run that worked an issue starts the next while untried agent-task issues remain (GitHub's scheduler skips runs)
        if: ${{ always() }}
        run: |
          cat agent.*.json 2>/dev/null | grep -q '"issue"' || { echo "no issue worked: no chain"; exit 0; }
          n=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&labels=agent-task&per_page=100" --jq '[.[]|select((.labels|map(.name)|index("agent-failed"))|not)]|length')
          echo "untried agent-task issues: $n"
          if [ "$n" -gt 0 ]; then gh workflow run agent.yml || echo "chain dispatch failed; the 2-hour schedule and deploy trigger are the other routes"; fi
      - name: deploy what the agent merged (a push by the built-in token does not start workflows)
        if: ${{ always() }}
        run: cat agent.*.json | grep -q '"ok":true' && bash tools/dispatch_deploy.sh || echo "nothing merged"
  settle:
    # The live check is the merge gate: when the deploy of an agent change fails, the change is reverted and its issue reopened.
    if: ${{ vars.HALT != '1' && github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: node --no-warnings tools/agent.mjs settle ${{ github.event.workflow_run.conclusion == 'failure' && '--force' || '' }}

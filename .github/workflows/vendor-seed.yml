name: vendor-seed
# SPDX-License-Identifier: LicenseRef-Ultrastable-USL-1.0
# TENANT-SYNC-1: keeps vendor/seed/ (the KGRAPH-1 engine) equal to the core's main, so an improvement to the shared knowledge graph
# reaches Practical Solutions with no person. scripts/vendor_seed.mjs fetches the files the core's registry maps for this tenant (public repository, no credential), the
# tests run on the result, and only a green result is committed to main. The platform's tenant-repos workflow sees main move past the last
# deploy and redeploys the Worker (foundation/tenantrepos.py --behind), so the refresh reaches production the same day.
# budget: ~1 min per run, once a day (~30 min a month)
# trigger: daily (engine changes in the core land at most a few times a day); manual dispatch
# free-alternative: `node scripts/vendor_seed.mjs && npm test` from a cloud-hosted agent session
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: vendor-seed
  cancel-in-progress: false
jobs:
  sync:
    if: ${{ vars.HALT != '1' }}  # HALT-1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: {node-version: 24}
      - name: Fetch the core's current copies
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: node scripts/vendor_seed.mjs
      - name: Test before committing (a core change that breaks Practical Solutions stays out and turns this run red)
        run: npm test
      - name: Commit to main
        run: |
          set -euo pipefail
          if git diff --quiet; then echo "vendored files already match core main"; exit 0; fi
          git config user.name "ultrastable-vendor-seed"; git config user.email "vendor-sync@users.noreply.github.com"
          git add vendor/seed
          git commit -m "vendor-sync: refresh core files from $(head -1 vendor/seed/VENDORED_FROM) (TENANT-SYNC-1)"
          git push origin HEAD:main
      - name: Probe (red while any vendored file differs from core main)
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: node scripts/vendor_seed.mjs --check

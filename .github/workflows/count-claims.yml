# COUNT-CLAIMS-1: every count the live home page shows must equal the data behind the page it links to. Opens its own fix item on drift and closes it when the probe passes.
# budget: ~1 minute per run, 4 runs a day
# trigger: schedule every 6 hours, since the data refreshes daily and a deploy can change either side
# free-alternative: the tick Worker could run the same fetch
name: count-claims
on:
  schedule: [{ cron: "17 */6 * * *" }]
  workflow_dispatch: {}
concurrency: { group: count-claims, cancel-in-progress: false }
permissions: { contents: read, issues: write }
jobs:
  probe:
    if: ${{ vars.HALT != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/countclaims.mjs

# budget: about 3 minutes a day.
# trigger: daily; the loop's own refresh cadence is days, so faster adds cost and no information.
# free-alternative: a Cloudflare cron worker that dispatches this workflow (the bootstrap workflow deploys one when its secrets exist).
# One scheduled cycle on persisted state: tick, measure essential variables, correct, record, publish open data. Needs no secrets.
name: cycle
on:
  schedule: [{ cron: '17 3 * * *' }]
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: cycle, cancel-in-progress: false }
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: node --no-warnings bin/ps.mjs cycle --run ${{ github.run_number }}
      - name: commit the ledger
        run: |
          git config user.name practical-solutions-bot
          git config user.email bot@users.noreply.github.com
          git add ledger
          git diff --cached --quiet || { git commit -m "cycle ${{ github.run_number }}"; git pull --rebase -q; git push; }

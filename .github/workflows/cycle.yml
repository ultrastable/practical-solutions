# budget: about 3 minutes a day.
# trigger: daily; the loop's refresh cadence is days, so faster adds cost and no information.
# free-alternative: a Cloudflare cron worker that dispatches this workflow.
# The continuous loop on GitHub's own compute, needing no secret beyond the built-in GITHUB_TOKEN: `ps cycle` restores the committed
# state (ledger/ps.sqlite), ticks against live World Bank data, records essential variables, corrective actions and out-of-bounds
# tests as one line in ledger/cycles.jsonl, publishes verified briefs as open data with a changelog, and this job files one issue
# per new brief, closed at once with its prediction's disposition and commented with the verdict when scored (ps/issues.js). Predictions registered in one cycle come due and are scored in a later one.
name: cycle
on:
  schedule: [{ cron: '17 3 * * *' }]
  workflow_dispatch: {}
concurrency: { group: cycle, cancel-in-progress: false }
permissions: { contents: write, issues: write, models: read, id-token: write }
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PS_LLM_URL: https://tenant-ps-llm.ultrastable.workers.dev/ps/llm
      GITHUB_MODELS_TOKEN: ${{ github.token }}  # the model route that needs no key a person mints: GitHub Models on the run's own token
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }  # never the dispatch SHA: a queued run must start from the state the previous run committed (run 5 failed on add/add conflicts from a stale checkout)
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: run one cycle on persisted state
        run: node --no-warnings bin/ps.mjs cycle --db ledger/ps.sqlite --ledger ledger/cycles.jsonl --out ledger/briefs --n 8 --run ${{ github.run_number }}
      - name: bright-spot issues (ISSUE-LOOP-1)
        id: issues
        continue-on-error: true  # a failed gh call is logged by bin/issues.mjs and fails this step visibly; the state commit below still runs
        run: node --no-warnings bin/issues.mjs --db ledger/ps.sqlite --briefs ledger/briefs
      - name: commit state
        run: |
          git config user.name practical-solutions-bot
          git config user.email bot@users.noreply.github.com
          git add ledger
          git diff --cached --quiet || { git commit -m "cycle ${{ github.run_number }}: state, ledger, briefs"; for i in 1 2 3; do git pull --rebase -q -X theirs origin main && git push && break; git rebase --abort || true; git fetch -q origin main; sleep $((i*5)); done; git fetch -q origin main; git merge-base --is-ancestor HEAD origin/main; }

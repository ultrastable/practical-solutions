# The continuous loop on GitHub's own compute, needing no secret beyond the built-in GITHUB_TOKEN: restore state, run ticks on the
# real clock against live World Bank data, publish briefs as files and one issue per new brief, record criticality, commit state.
# State is ledger/ps.sqlite (small, committed), so the next scheduled run continues where this one stopped and predictions come due.
name: cycle
on:
  schedule: [{ cron: '17 3 * * *' }]
  workflow_dispatch: {}
concurrency: { group: cycle, cancel-in-progress: false }
permissions: { contents: write, issues: write }
jobs:
  cycle:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: restore or create state
        run: |
          mkdir -p ledger
          [ -f ledger/ps.sqlite ] || node --no-warnings bin/ps.mjs init --db ledger/ps.sqlite
      - name: run ticks
        run: node --no-warnings bin/ps.mjs tick --db ledger/ps.sqlite --n 8 | tee ledger/last-cycle.txt
      - name: publish briefs and record criticality
        run: |
          node --no-warnings bin/ps.mjs export --db ledger/ps.sqlite --out briefs
          node --no-warnings bin/ps.mjs criticality --db ledger/ps.sqlite > ledger/criticality.json || true
          gh label create bright-spot -R "$GITHUB_REPOSITORY" --color 0e8a16 --description "Lead from the loop; a hypothesis to check, not a finding" 2>/dev/null || true
          node -e "for (const b of JSON.parse(require('fs').readFileSync('briefs/index.json','utf8'))) console.log(b.file)" | while read f; do
            t="Bright spot: ${f%.md}"
            n=$(gh issue list -R "$GITHUB_REPOSITORY" --label bright-spot --state all --search "\"$t\" in:title" --json number --jq length)
            [ "$n" = 0 ] && gh issue create -R "$GITHUB_REPOSITORY" --label bright-spot --title "$t" --body-file "briefs/$f" || true
          done
      - name: commit state
        run: |
          git config user.name practical-solutions-bot
          git config user.email bot@users.noreply.github.com
          git add ledger briefs
          git diff --cached --quiet || { git commit -m "cycle ${{ github.run_number }}: state, briefs, criticality"; git pull --rebase -q; git push; }
